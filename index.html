<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>독서기록</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#e8eaf0;--accent:#4f46e5;--accent2:#06b6d4;--soft:#eef0ff;--quote:#f3f4f9;--danger:#ef4444;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--card:#161922;--text:#eceef4;--muted:#9aa1b2;--line:#262a37;--accent:#818cf8;--accent2:#22d3ee;--soft:#222645;--quote:#1c202b;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0d0f14;--card:#161922;--text:#eceef4;--muted:#9aa1b2;--line:#262a37;--accent:#818cf8;--accent2:#22d3ee;--soft:#222645;--quote:#1c202b;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Segoe UI","Noto Sans KR",Roboto,sans-serif;line-height:1.6;padding:1.5rem 1rem 4rem;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:320px;background:radial-gradient(60% 100% at 20% 0,color-mix(in srgb,var(--accent) 22%,transparent),transparent),radial-gradient(50% 100% at 85% 0,color-mix(in srgb,var(--accent2) 18%,transparent),transparent);pointer-events:none;z-index:-1}
.wrap{max-width:900px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.03em}

.sub{color:var(--muted);font-size:.9rem}
#secret{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:default}
.hr{display:flex;gap:.6rem;align-items:center}
.btn{border:0;cursor:pointer;font:inherit;font-weight:600;font-size:.88rem;padding:9px 16px;border-radius:10px;background:#4f46e5;color:#fff;box-shadow:0 6px 16px -6px #4f46e5}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:1rem}
.views{display:none;align-items:center;gap:6px;background:var(--soft);color:var(--accent);padding:5px 10px;border-radius:8px;font-size:.82rem;font-weight:700}
body.admin .views{display:flex}
.views button{border:0;background:var(--line);color:var(--text);width:22px;height:22px;border-radius:6px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:.8rem}
.stat,.panel,.book,.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stat{padding:1rem 1.1rem}
.stat small{color:var(--muted);font-size:.75rem;font-weight:600}
.stat b{display:block;font-size:1.7rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.charts{display:grid;grid-template-columns:1fr;gap:.8rem;margin-bottom:1.6rem}
.chart{padding:1rem 1.1rem}
.chart h3{font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:.4rem}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:10px}.chart text.cnt{fill:var(--text);font-weight:700;font-size:11px;pointer-events:none}
.search{position:relative;margin-bottom:1.4rem}
.search input{width:100%;padding:13px 16px 13px 42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;outline:0;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.95rem}
.list{display:flex;flex-direction:column;gap:1.2rem}
.book{padding:1.3rem;position:relative;will-change:transform}
.top{display:grid;grid-template-columns:130px 1fr;gap:1.3rem}
.cover{width:130px;height:186px;border-radius:10px;object-fit:cover;image-rendering:auto;transform:translateZ(0);backface-visibility:hidden;box-shadow:0 12px 24px -10px rgba(0,0,0,.4);display:grid;place-items:center;color:#fff;font-weight:800;text-align:center;padding:10px;font-size:.95rem;line-height:1.3;word-break:keep-all}
.title{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;line-height:1.3;padding-right:5.5rem}
.meta{color:var(--muted);font-size:.85rem}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0}
.tag{background:var(--soft);color:var(--accent);font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:99px}
.date{font-size:.8rem;color:var(--muted)}
.prog{margin-top:.7rem}
.prog div:first-child{display:flex;justify-content:space-between;font-size:.76rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.quote{margin-top:1.1rem;background:var(--quote);border-left:4px solid var(--accent);padding:.9rem 1.1rem;border-radius:0 12px 12px 0}
.quote small{display:block;color:var(--muted);font-weight:700;font-size:.75rem;margin-bottom:2px}
.quote p{font-style:italic;white-space:pre-wrap;word-break:break-word;font-size:.94rem}
.review{margin-top:.8rem;padding:.8rem 1rem;border-radius:12px;background:var(--soft);font-size:.92rem;white-space:pre-wrap;word-break:break-word}
.acts{position:absolute;top:1rem;right:1rem;display:none;gap:6px}
body.admin .acts{display:flex}
.acts button{border:0;border-radius:8px;padding:4px 10px;font-size:.75rem;font-weight:700;cursor:pointer;background:var(--soft);color:var(--accent)}
.acts .del{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.panel{display:none;padding:1.4rem;margin-bottom:1.6rem}
.panel h2{font-size:1.15rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.f{display:flex;flex-direction:column;gap:.3rem}.f.full{grid-column:span 2}
label{font-size:.8rem;font-weight:700;color:var(--muted)}
.f input,.f textarea{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;outline:0}
.f input:focus,.f textarea:focus{border-color:var(--accent)}
:root[data-theme="dark"] .f input,:root[data-theme="dark"] .shelf input{color-scheme:dark}
.f textarea{min-height:70px;resize:vertical}
.shelf{display:flex;flex-wrap:wrap;gap:.7rem;align-items:flex-end;padding:.9rem 1rem;margin-bottom:1.1rem;background:var(--soft);border-radius:12px}.shelf b{width:100%;font-size:.85rem}.shelf label{display:flex;flex-direction:column;gap:.25rem;flex:1;min-width:140px}.shelf input{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;outline:0}.shelf input:focus{border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:3rem 1rem}
.note{font-size:.75rem;color:var(--muted);text-align:center;margin-top:2rem}
img.cover{cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;place-items:center;z-index:100;padding:1.5rem;cursor:zoom-out;opacity:0;transition:opacity .25s}.lb.on{opacity:1}.lb img{max-width:min(92vw,480px);max-height:88vh;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:scale(.92);transition:transform .25s}.lb.on img{transform:none}
@media(max-width:680px){.stats{grid-template-columns:repeat(3,1fr);gap:.5rem}.stat{padding:.75rem}.stat b{font-size:1.4rem}.charts{grid-template-columns:1fr}.top{grid-template-columns:1fr}.cover{margin:0 auto}.title{padding-right:0}.grid{grid-template-columns:1fr}.f.full{grid-column:span 1}.acts{position:static;margin-bottom:.6rem;justify-content:flex-end}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1><span id="secret">📚</span> <span>Book Log</span></h1></div>
    <div class="hr">
      <div class="views"><span id="views">👀 …</span><button id="minus" title="조회수 -1">−</button></div>
      <button class="btn ghost icon" id="theme" title="테마">🌓</button>
      
    </div>
  </header>

  <section class="panel" id="panel">
    <h2><span id="fh">새 도서 기록 추가</span><button class="btn ghost" id="back" type="button">← 돌아가기</button></h2>
    <div class="shelf"><b>📌 상단 현황 수정</b><label>현재 대여 중 (권)<input type="number" id="sLend" min="0"></label><label>읽을 예정 (권)<input type="number" id="sWish" min="0"></label><button class="btn" id="sSave" type="button">적용</button></div>
    <form class="grid" id="form">
      <div class="f full"><label>도서 제목 *</label><input id="title" required placeholder="예: 50센티 더 가까워지는 선물보다 좋은 말"></div>
      <div class="f"><label>저자</label><input id="author"></div>
      <div class="f"><label>출판사 및 연도</label><input id="publisher" placeholder="예: 밀리언서재 (2022)"></div>
      <div class="f full"><label>해시태그</label><input id="hashtags" placeholder="자기계발, 대화법 (쉼표나 띄어쓰기로 구분)"></div>
      <div class="f full"><label>표지 이미지 링크 (권장 · 고화질)</label><input id="coverUrl" placeholder="https://… 이미지 주소를 붙여넣으세요"></div>
      <div class="f full"><label>또는 표지 이미지 파일 (저용량으로 변환되어 저장됨)</label><input type="file" id="cover" accept="image/*"></div>
      <div class="f"><label>읽기 시작한 날짜</label><input type="date" id="startDate"></div>
      <div class="f"><label>완독한 날짜</label><input type="date" id="endDate"></div>
      <div class="f full"><label>독서 진행률 (%)</label><input type="number" id="progress" min="0" max="100" value="0"></div>
      <div class="f full"><label>인상 깊은 구절 위치</label><input id="quotePage" placeholder="예: p.101"></div>
      <div class="f full"><label>인상 깊은 구절 내용</label><textarea id="quote"></textarea></div>
      <div class="f full"><label>한줄평 *</label><textarea id="review" required></textarea></div>
      <button class="btn full" style="grid-column:1/-1;padding:12px" id="save">도서 기록 저장하기</button>
    </form>
  </section>

  <section class="stats" id="stats"></section>
  <section class="charts">
    <div class="chart"><h3>월별 독서 기록</h3><svg id="area" viewBox="0 0 800 150"></svg></div>
    
  </section>

  <div class="search"><input id="q" placeholder="제목, 저자, 한줄평, 해시태그 검색…"></div>
  <main class="list" id="list"></main>
  <p class="note" id="note"></p>
  <div class="lb" id="lb"><img id="lbImg" referrerpolicy="no-referrer" alt="표지 크게 보기"></div>
</div>

<script>
(async()=>{

const PW="MjMxMg==";

const M=window.Motion||{}, A=window.anime;

 {id:'a',title:'50센티 더 가까워지는 선물보다 좋은 말',author:'노구치 사토시',publisher:'밀리언서재 (2022)',hashtags:'자기계발, 대화법, 인간관계',startDate:'2026-10-01',endDate:'2026-10-14',progressPercent:100,quotePage:'p.101',quoteContent:'말 한마디가 거리를 50센티 좁혀 준다.',oneLineReview:'일상에서 바로 써먹을 수 있는 표현이 가득했다.',createdAt:'2026-10-14T00:00:00Z'},

 return{demo:true,all:async()=>d.slice(),save:async(id,o)=>{if(id){Object.assign(d.find(x=>x.id===id),o)}else d.push({id:'n'+Date.now(),...o,createdAt:new Date().toISOString()})},del:async id=>{d.splice(d.findIndex(x=>x.id===id),1)},views:async()=>v,inc:async n=>{v=Math.max(0,v+n);return v},counters:async()=>({...c}),setCounters:async o=>{c={...c,...o}}}};

   inc:async n=>{await F.runTransaction(F.ref(db,'stats/viewCount'),c=>Math.max(0,(c||0)+n));return st.views()},counters:async()=>{const s=await F.get(F.ref(db,'stats/shelf'));return{lending:0,wish:0,...(s.val()||{})}},setCounters:o=>F.update(F.ref(db,'stats/shelf'),o)};

if(st.demo)$('note').textContent='예시 데이터로 표시 중입니다 (Firebase 연결 실패). 사유: '+(st.err&&st.err.message?st.err.message:'알 수 없음');

/* ---------- helpers ---------- */
const pct=b=>b.endDate?100:Math.min(100,Math.max(0,Number(b.progressPercent)||0));
const tagsOf=b=>(b.hashtags||'').split(/[,\s]+/).filter(Boolean).map(t=>t.replace(/^#/,''));

const count=(el,to,suf='')=>{const o={v:0};A?A({targets:o,v:to,round:1,duration:1200,easing:'easeOutExpo',update:()=>el.textContent=o.v.toLocaleString()+suf}):el.textContent=to+suf};

/* ---------- stats & charts (Bklit-style minimal charts) ---------- */
function renderStats(list){
  const yr=list.filter(b=>new Date(b.endDate||b.createdAt).getFullYear()===new Date().getFullYear()).length;
  const spans=list.filter(b=>b.startDate&&b.endDate).map(b=>(new Date(b.endDate)-new Date(b.startDate))/864e5+1).filter(n=>n>0);const avg=spans.length?Math.round(spans.reduce((a,n)=>a+n,0)/spans.length):'-';
  const tc={};list.forEach(b=>tagsOf(b).forEach(t=>tc[t]=(tc[t]||0)+1));const tt=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0];const topT=tt?'#'+tt[0]:'-';

  list.forEach(b=>{const d=new Date(b.endDate||b.createdAt||b.startDate);const m=months.find(x=>x.k===d.getFullYear()*12+d.getMonth());if(m)m.n++});
  const mx=Math.max(1,...months.map(m=>m.n)),W=800,H=120,px=i=>20+i*(W-40)/5,py=n=>H-8-(n/mx)*(H-30);

   ${[0,.5,1].map(t=>`<line x1="20" x2="780" y1="${H-8-t*(H-30)}" y2="${H-8-t*(H-30)}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('')}

   ${pts.map((p,i)=>`<text class="cnt" x="${p[0]}" y="${p[1]-11}" text-anchor="middle">${months[i].n}권</text>`).join('')}
   ${months.map((m,i)=>`<text x="${px(i)}" y="145" text-anchor="middle">${m.l}</text>`).join('')}`;
  const tc={};list.forEach(b=>tagsOf(b).forEach(t=>tc[t]=(tc[t]||0)+1));
  const top=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,5),tm=Math.max(1,...top.map(t=>t[1]));
  
  if(A){
    A({targets:'#ln',strokeDashoffset:[A.setDashoffset,0],duration:1400,easing:'easeInOutSine'});
    A({targets:'#fill',opacity:[0,1],duration:900,delay:900,easing:'linear'});
    A({targets:'.dot',scale:[0,1],opacity:[0,1],delay:A.stagger(120,{start:300}),duration:500,easing:'easeOutBack'});
    A({targets:'.cnt',opacity:[0,1],translateY:[6,0],delay:A.stagger(120,{start:500}),duration:500,easing:'easeOutCubic'});
    document.querySelectorAll('#bars .b').forEach((r,i)=>A({targets:r,width:+r.dataset.w,delay:i*90,duration:900,easing:'easeOutExpo'}));
  }else document.querySelectorAll('#bars .b').forEach(r=>r.setAttribute('width',r.dataset.w));
}

/* ---------- book cards ---------- */
function render(list,animate=true){
  if(!list.length){$('list').innerHTML='<div class="empty">등록되거나 검색된 도서 기록이 없습니다.</div>';return}
  $('list').innerHTML=list.map(b=>{
    const p=pct(b),h=hue(b.title||'x');
    const cover=b.coverUrl?`<img class="cover" referrerpolicy="no-referrer" loading="lazy" src="${esc(b.coverUrl)}" alt="${esc(b.title)} 표지">`:`<div class="cover" style="background:linear-gradient(145deg,hsl(${h} 70% 55%),hsl(${(h+50)%360} 65% 38%))">${esc(b.title)}</div>`;
    const date=(b.startDate||b.endDate)?`📅 ${esc(b.startDate||'')} ~ ${esc(b.endDate||'')}`:'';
    return `<article class="book" data-id="${esc(b.id)}">
     <div class="acts"><button data-a="edit">수정</button><button class="del" data-a="del">삭제</button></div>
     <div class="top">${cover}<div>
      <h2 class="title">${esc(b.title)}</h2>
      <p class="meta">${esc(b.author)}${b.publisher?' | '+esc(b.publisher):''}</p>
      <div class="tags">${tagsOf(b).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>
      <div class="date">${date}</div>
      <div class="prog"><div><span>독서 진행률</span><span>${p}%</span></div><div class="bar"><i data-w="${p}"></i></div></div>
     </div></div>
     ${b.quoteContent?`<div class="quote"><small>💡 인상 깊은 구절 ${b.quotePage?'('+esc(b.quotePage)+')':''}</small><p>“${esc(b.quoteContent)}”</p></div>`:''}
     <div class="review"><b>📝 한줄평:</b> ${esc(b.oneLineReview)}</div></article>`}).join('');
  document.querySelectorAll('.book').forEach(card=>{
    const fill=card.querySelector('.bar i'),w=fill.dataset.w+'%';
    const go=()=>{try{M.animate&&M.animate(fill,{width:['0%',w]},{duration:1.1,ease:[.22,1,.36,1]})}catch(e){}fill.style.width=w};
    card.style.opacity=1;fill.style.width=w;
    if(M.animate){
      
      
    }
  });
}

async function load(){
  try{books=(await st.all()).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))}
  catch(e){$('list').innerHTML='<div class="empty">데이터를 불러오는 중 오류가 발생했습니다.<br>Firebase 규칙 또는 설정을 확인해주세요.</div>';return}
  try{shelf=await st.counters()}catch(e){}
  renderStats(books);renderCharts(books);render(books);
}

/* ---------- views / admin ---------- */
async function showViews(){try{$('views').textContent='👀 조회수: '+(await st.views()).toLocaleString()+'회'}catch(e){$('views').textContent='👀 확인 불가'}}
$('minus').onclick=async()=>{await st.inc(-1);showViews()};
function openPanel(){$('sLend').value=shelf.lending;$('sWish').value=shelf.wish;
  const p=$('panel');p.style.display='block';document.body.classList.add('admin');
  if(M.animate)M.animate(p,{opacity:[0,1],transform:['translateY(-20px)','none']},{duration:.45,ease:[.22,1,.36,1]});
  p.scrollIntoView({behavior:'smooth',block:'start'});
}
function closePanel(){
  const p=$('panel'),end=()=>{p.style.display='none';document.body.classList.remove('admin')};
  M.animate?M.animate(p,{opacity:[1,0],transform:['none','translateY(-16px)']},{duration:.25}).finished.then(end):end();
}
const enterAdmin=async()=>{
  const pw=prompt('비밀번호를 입력하세요:');if(pw===null)return;
  if(btoa(pw)!==PW)return alert('비밀번호가 올바르지 않습니다.');
  $('form').reset();$('form').dataset.id='';$('fh').textContent='새 도서 기록 추가';$('save').textContent='도서 기록 저장하기';
  openPanel();await st.inc(-1);showViews();
};
(()=>{const el=$('secret');let t=null;const stop=()=>{clearTimeout(t);t=null};el.addEventListener('pointerdown',()=>{stop();t=setTimeout(()=>{t=null;enterAdmin()},1000)});['pointerup','pointerleave','pointercancel'].forEach(n=>el.addEventListener(n,stop));el.addEventListener('contextmenu',e=>e.preventDefault())})();
$('sSave').onclick=async()=>{try{await st.setCounters({lending:Math.max(0,+$('sLend').value||0),wish:Math.max(0,+$('sWish').value||0)});shelf=await st.counters();renderStats(books)}catch(e){alert('저장 실패: '+e.message)}};
$('back').onclick=closePanel;
function openLb(src){$('lbImg').src=src;const l=$('lb');l.style.display='grid';requestAnimationFrame(()=>l.classList.add('on'))}
function closeLb(){const l=$('lb');l.classList.remove('on');setTimeout(()=>{l.style.display='none'},250)}
$('lb').onclick=closeLb;addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});
$('list').onclick=async e=>{
  if(e.target.matches('img.cover')){openLb(e.target.src);return}const a=e.target.dataset.a;if(!a)return;
  const id=e.target.closest('.book').dataset.id,b=books.find(x=>x.id===id);
  if(a==='del'){if(!confirm('정말 이 도서 기록을 삭제하시겠습니까?'))return;await st.del(id);await load()}
  if(a==='edit'){
    $('form').dataset.id=id;
    Object.entries({title:b.title,author:b.author,publisher:b.publisher,hashtags:b.hashtags,startDate:b.startDate,endDate:b.endDate,progress:b.progressPercent||0,quotePage:b.quotePage,quote:b.quoteContent,review:b.oneLineReview}).forEach(([k,v])=>$(k).value=v||'');
    $('coverUrl').value=/^https?:/.test(b.coverUrl||'')?b.coverUrl:'';$('cover').value='';$('fh').textContent='도서 기록 수정하기';$('save').textContent='수정사항 저장하기';openPanel();
  }
};
const resize=f=>new Promise(r=>{const fr=new FileReader();fr.onload=e=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=400;c.height=i.height*400/i.width;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=e.target.result};fr.readAsDataURL(f)});
$('form').onsubmit=async e=>{
  e.preventDefault();
  const id=$('form').dataset.id,old=books.find(b=>b.id===id),f=$('cover').files[0];
  const data={title:$('title').value.trim(),author:$('author').value.trim(),publisher:$('publisher').value.trim(),hashtags:$('hashtags').value.trim(),
   coverUrl:f?await resize(f):($('coverUrl').value.trim()||(old?old.coverUrl||'':'')),startDate:$('startDate').value,endDate:$('endDate').value,progressPercent:$('progress').value,
   quotePage:$('quotePage').value.trim(),quoteContent:$('quote').value.trim(),oneLineReview:$('review').value.trim()};
  try{await st.save(id||null,data);closePanel();await load()}catch(err){alert('처리 중 오류가 발생했습니다: '+err.message)}
};
$('q').oninput=e=>{const k=e.target.value.toLowerCase();
  render(books.filter(b=>[b.title,b.author,b.oneLineReview,b.hashtags].some(v=>v&&v.toLowerCase().includes(k))),false)};
$('theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};

addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
if(A)A({targets:'header > *',opacity:[0,1],translateY:[-14,0],delay:A.stagger(100),duration:700,easing:'easeOutCubic'});
await load();
await st.inc(1);showViews();
})();
</script>
